<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1f27" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>YouLink — Creative & marketing studio for growing brands</title>
    <meta
      name="description"
      content="YouLink is a collaborative creative and marketing platform. Branding, social media management, website development and marketing & ads, delivered by supervised freelance teams."
    />
    <meta name="author" content="YouLink" />
    <!-- TODO: add <link rel="canonical">, og:url and og:image once the production domain is confirmed. -->

    <meta property="og:site_name" content="YouLink" />
    <meta property="og:title" content="YouLink — we connect you with a you" />
    <meta
      property="og:description"
      content="We don't just create content or run ads — we build brands from the ground up. Branding, social media, websites and marketing for growing businesses."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YouLink — we connect you with a you" />
    <meta
      name="twitter:description"
      content="A collaborative creative and marketing platform helping small businesses become recognisable brands."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "YouLink",
        "slogan": "we connect you with a you",
        "description": "YouLink is a collaborative creative and marketing platform focused on helping brands grow with strategy, creativity and consistency, through a structured freelance ecosystem where skilled teams work under supervision.",
        "sameAs": ["https://www.instagram.com/youlink.in/"]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
